exclude: '^documents/'
repos:
-   repo: https://github.com/asottile/pyupgrade
    rev: v2.37.3
    hooks:
    -   id: pyupgrade
        args: [--py37-plus, --keep-runtime-typing]
        stages: [commit]
-   repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
    -   id: isort
        args: [ "--profile", "black" ]
        stages: [commit]
-   repo: https://github.com/pycqa/flake8
    rev: 3.9.2
    hooks:
    -   id: flake8
        additional_dependencies:
        -   flake8-django==1.1.2
        -   flake8-pytest-style==1.6.0
        -   flake8-typing-imports==1.12.0
        args: [ --max-line-length=128, '--extend-ignore=DJ08,DJ01']
        stages: [commit]
        exclude: '^backend/\w+/migrations'
-   repo: https://github.com/PyCQA/bandit
    rev: 1.7.4
    hooks:
    -   id: bandit
        args: [-r, -n, '10', -x, '*/*/tests/*', -s, 'B310']
        stages: [commit]
        exclude: '^backend/\w+/migrations'
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v0.971
    hooks:
    -   id: mypy
        stages: [commit]
        files: '^backend/'
        exclude: '^backend/\w+/migrations'
        additional_dependencies:
        - types-pytz==2022.1.2
        - types-bleach==5.0.3
        - types-python-dateutil==2.8.19
        - types-requests==2.28.7
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
    -   id: check-ast
        stages: [commit]
    -   id: fix-byte-order-marker
        stages: [commit]
    -   id: check-json
        stages: [commit]
    -   id: check-merge-conflict
        stages: [commit]
    -   id: check-yaml
        stages: [commit]
    -   id: end-of-file-fixer
        stages: [commit]
        exclude: '^(frontend/(build/|dist/))'
    -   id: debug-statements
        stages: [commit]
    -   id: no-commit-to-branch
        args: [--branch, master, --branch, develop]
        stages: [commit]
    -   id: trailing-whitespace
        stages: [commit]
-   repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.39.1
    hooks:
    -   id: eslint
        # Flat-config imports resolve from the config file's directory. Copy the
        # project config into the hook env (as .mjs) so @eslint/js etc. resolve.
        entry: bash -c 'HOOK_ROOT="$(cd "$(dirname "$(which eslint)")/.." && pwd)"; CONF_DIR="$HOOK_ROOT/lib"; if [ ! -d "$CONF_DIR/node_modules/@eslint" ]; then CONF_DIR="$HOOK_ROOT"; fi; REPO_ROOT="$(pwd)"; cp "$REPO_ROOT/src/frontend/eslint.config.js" "$CONF_DIR/eslint.config.mjs"; files=(); for f in "$@"; do files+=("$REPO_ROOT/$f"); done; cd "$CONF_DIR" && eslint -c "$CONF_DIR/eslint.config.mjs" --fix --no-warn-ignored "${files[@]}"' --
        additional_dependencies:
        -   eslint@9.39.5
        -   '@eslint/js@9.39.5'
        -   globals@17.7.0
        -   eslint-plugin-react@7.37.5
        -   eslint-config-prettier@10.1.8
        stages: [commit]
        exclude: '^(frontend/(build/|dist/|public/)|backend/.+/static/.*/vendor/)'
        types: [file]
        files: ^src/frontend/.*\.(js|jsx)$
-   repo: https://github.com/jorisroovers/gitlint
    rev: v0.17.0
    hooks:
    -   id: gitlint
        stages: [commit-msg]
