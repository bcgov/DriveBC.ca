{% extends 'email/notification_base.html' %}

{% block cards %}
<table width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:375px; margin:0 auto; border:1px solid #EDEBE9; border-radius:8px; border-collapse:separate; box-shadow:0 3px 7px rgba(0,0,0,0.13)">
  <!-- Header -->
  <tr>
    <td bgcolor="#FFF4F0" style="padding:12px 16px; border-radius:8px 8px 0 0; font-size:14px; line-height:20px; font-weight:700; color:#C84507">
      <img src="cid:dclogo" width="12" height="14" style="width:12px; height:14px; vertical-align:middle; margin-right:8px" alt="" />
      Advisory
    </td>
  </tr>
  <tr>
    <td style="padding:16px 16px 0">
      <a href="{{ site_link }}" target="_blank" rel="noopener noreferrer" style="font-size:18px; line-height:27px; font-weight:700; color:#255A90; text-decoration:none">{{ advisory.title }}</a>
    </td>
  </tr>
  <tr>
    <td style="padding:12px 16px 0; font-size:14px; line-height:21px; color:#2D2D2D">
      {{ advisory.description }}
    </td>
  </tr>
  <tr>
    <td style="padding:16px 16px 0; font-size:12px; line-height:18px; color:#2D2D2D">
      Updated {{ advisory.latest_revision_created_at|date:'D, M j, Y \a\t g:i a' }}
    </td>
  </tr>
  <tr>
    <td align="center" style="padding:24px 16px 16px">
      <a href="{{ site_link }}" target="_blank" rel="noopener noreferrer" style="color:#255A90; font-size:16px; line-height:24px; font-weight:700; text-decoration:underline">View full details</a>
    </td>
  </tr>
</table>
{% endblock %}
